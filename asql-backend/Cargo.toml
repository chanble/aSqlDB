[package]
name = "asql-backend"
version = "0.1.0"
edition = "2021"
description = "Business logic layer for aSqlDB - shared across TUI, CLI, and future UI implementations"
license = "MIT"

[dependencies]
# Internal crates
asql-query = "0.1.0"
asql-sql = "0.1.0"

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "1"
thiserror = "2"

# Logging
tracing = "0.1"

[features]
default = []
