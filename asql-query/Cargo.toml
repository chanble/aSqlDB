[package]
name = "asql-query"
version = "0.1.0"
edition = "2021"
description = "Unified query protocol layer: typed SQL builders + structured execution results"
license = "MIT"

[dependencies]
asql-dsl = "0.1.0"
asql-core = "0.2.0"
asql-sql = "0.1.0"
asql-types = "0.1.0"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
futures = "0.3"
