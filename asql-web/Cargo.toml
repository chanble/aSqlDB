[package]
name = "asql-web"
version = "0.1.0"
edition = "2021"
description = "Web frontend for aSqlDB - Axum backend + Vue 3 frontend"
license = "MIT"

[dependencies]
# Internal crates
asql-backend = { path = "../asql-backend" }
asql-query = { path = "../asql-query" }
asql-types = { path = "../asql-types" }

strum = "0.26"
clap = { version = "4", features = ["derive", "env"] }

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tower = "0.5"

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
