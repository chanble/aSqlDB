[package]
name = "asql-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
asql-types = { path = "../asql-types" }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "mysql",
    "postgres",
    "sqlite",
    "chrono",
    "rust_decimal",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
rust_decimal = { version = "1.42", features = ["serde-with-str"]}
tracing = "0.1"
futures-util = "0.3"

[dev-dependencies]
serial_test = "3"
